name: Publish

# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC), so there is no long lived npm token to store: the job
# requests a short lived identity token and npm verifies it against the trusted
# publisher configured for this package on npmjs.com. Provenance is attached
# automatically.
#
# One time setup on npmjs.com: add this repository and the "Publish" workflow as
# a trusted publisher for the package before the first release.

on:
  release:
    types: [published]
  # Manual trigger for publishing the current main without cutting a release,
  # and as an escape hatch if a release run needs to be repeated.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment set on the npm trusted publisher, or the OIDC
    # token exchange fails with "package not found".
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # No dependency cache on a release build.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the
      # version bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # prepublishOnly reruns tests, typecheck, build, and the publish
      # validators as a final gate. Provenance is implied by the OIDC flow.
      - run: npm publish --access public
